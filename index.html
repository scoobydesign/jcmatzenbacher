<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d16">
<meta name="description" content="Links de Júlio Matzenbacher (@jcmatzenbacher).">
<title>Júlio Matzenbacher — Links</title>
<style>
  :root{
    --bg:#0a0d16;
    --text:#f3f1ea;
    --muted:#949ab0;
    --accent:#f5b849;
    --surface:rgba(255,255,255,.045);
    --surface-hi:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --border-hi:rgba(245,184,73,.6);
    --ring:rgba(245,184,73,.28);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Menlo","Cascadia Code","Consolas",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(115% 75% at 50% -8%, rgba(245,184,73,.12), transparent 52%),
      radial-gradient(120% 70% at 50% 118%, rgba(86,74,150,.16), transparent 60%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{
    max-width:430px;
    margin:0 auto;
    padding:56px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .avatar{
    width:108px;height:108px;border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.14);
    box-shadow:0 0 0 4px rgba(245,184,73,.14), 0 0 44px var(--ring), 0 14px 40px rgba(0,0,0,.5);
    animation:pop .6s cubic-bezier(.2,.7,.3,1) both;
  }
  .name{
    margin:20px 0 0;
    font-size:1.55rem;font-weight:700;letter-spacing:-.02em;
    text-wrap:balance;text-align:center;line-height:1.15;
  }
  .handle{
    margin-top:8px;
    font-family:var(--mono);font-size:.8rem;letter-spacing:.02em;
    color:var(--accent);
    display:inline-flex;align-items:center;gap:6px;
  }
  .handle .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .tag{
    margin-top:10px;max-width:30ch;text-align:center;
    font-size:.9rem;line-height:1.45;color:var(--muted);text-wrap:balance;
  }
  .links{
    width:100%;
    margin-top:30px;
    display:flex;flex-direction:column;gap:12px;
  }
  .link{
    display:flex;align-items:center;gap:14px;
    padding:13px 16px 13px 13px;
    border-radius:15px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);text-decoration:none;
    transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    opacity:0;transform:translateY(10px);
    animation:rise .5s ease forwards;
  }
  .links .link:nth-child(1){animation-delay:.06s}
  .links .link:nth-child(2){animation-delay:.12s}
  .links .link:nth-child(3){animation-delay:.18s}
  .links .link:nth-child(4){animation-delay:.24s}
  .links .link:nth-child(5){animation-delay:.30s}
  .links .link:nth-child(6){animation-delay:.36s}
  .link:hover,.link:focus-visible{
    transform:translateY(-2px);
    background:var(--surface-hi);
    border-color:var(--border-hi);
    box-shadow:0 0 0 1px var(--border-hi), 0 10px 30px rgba(0,0,0,.4), 0 0 24px rgba(245,184,73,.12);
    outline:none;
  }
  .link:focus-visible{box-shadow:0 0 0 2px var(--accent), 0 10px 30px rgba(0,0,0,.4)}
  .ic{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .ic svg{width:23px;height:23px;display:block}
  .ic-ig{background:radial-gradient(120% 120% at 25% 110%,#feda75,#fa7e1e 28%,#d62976 58%,#962fbf 78%,#4f5bd5)}
  .ic-tt{background:#0f0f12}
  .ic-yt{background:#ff0033}
  .ic-li{background:#0a66c2}
  .ic-bl{background:#fb7299}
  .ic-x{background:#0f0f12}
  .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .lbl{font-weight:650;font-size:.98rem;letter-spacing:-.01em}
  .sub{font-family:var(--mono);font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{
    flex:0 0 auto;color:var(--muted);font-size:1.1rem;
    transition:transform .18s ease,color .18s ease;
  }
  .link:hover .arrow,.link:focus-visible .arrow{transform:translateX(3px);color:var(--accent)}
  .foot{
    margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.03em;color:var(--muted);
    opacity:.8;text-align:center;
  }
  .foot .rule{width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:8px}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .link,.avatar{animation:none;opacity:1;transform:none}
  }
</style>
